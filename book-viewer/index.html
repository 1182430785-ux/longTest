<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍查询系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #a5b4fc;
            --secondary: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --success: #10b981;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        /* Search */
        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Search Suggestions */
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 8px;
            padding: 0.5rem 0;
            box-shadow: var(--shadow);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .search-suggestions.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .suggestion-header {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-item:hover {
            background: var(--bg-hover);
        }

        .suggestion-icon {
            font-size: 1rem;
            opacity: 0.7;
        }

        .suggestion-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .suggestion-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-hover);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .hot-tags {
            padding: 0.75rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .hot-tag {
            padding: 0.35rem 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--primary-light);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hot-tag:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .search-icon {
            color: var(--text-muted);
            margin-right: 0.75rem;
            font-size: 1.25rem;
        }

        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 0.5rem 0;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            margin-right: 0.5rem;
            font-size: 1rem;
            opacity: 0;
            transition: all 0.2s ease;
        }

        .search-clear.visible {
            opacity: 1;
        }

        .search-clear:hover {
            color: var(--text-primary);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 1.5rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Main Content */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.5rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Section Title */
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Book Grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        /* Book Card */
        .book-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .book-cover {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .book-card:hover .book-cover img {
            transform: scale(1.05);
        }

        .book-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.25rem 0.75rem;
            background: var(--secondary);
            color: var(--bg-dark);
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 20px;
        }

        .book-rating {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .book-rating .star {
            color: var(--secondary);
        }

        .book-favorite {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.8);
        }

        .book-card:hover .book-favorite {
            opacity: 1;
            transform: scale(1);
        }

        .book-favorite:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .book-favorite.active {
            opacity: 1;
            background: rgba(239, 68, 68, 0.8);
        }

        .book-info {
            padding: 1rem;
        }

        .book-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-category {
            font-size: 0.75rem;
            color: var(--primary-light);
            background: rgba(99, 102, 241, 0.15);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .book-pages {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal Content */
        .modal {
            background: var(--bg-card);
            border-radius: 24px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-hover);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--primary);
        }

        .modal-body {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-height: calc(90vh - 80px);
            overflow-y: auto;
        }

        .modal-cover {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .modal-cover img {
            width: 100%;
            display: block;
        }

        .modal-details h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .modal-author {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-stat {
            text-align: center;
        }

        .modal-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .modal-stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .modal-section {
            margin-bottom: 1.5rem;
        }

        .modal-section h3 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-section p {
            color: var(--text-primary);
            line-height: 1.8;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .modal-tag {
            padding: 0.5rem 1rem;
            background: var(--bg-hover);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* Button Active States */
        .btn:active {
            transform: scale(0.95);
        }

        .search-btn:active {
            transform: scale(0.95);
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast-icon {
            font-size: 1.25rem;
        }

        .toast-message {
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        /* Preview Mode */
        .preview-container {
            background: #1a1a2e;
            padding: 2rem;
            border-radius: 16px;
            margin-top: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .preview-content {
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 2;
            color: var(--text-secondary);
        }

        .preview-content p {
            text-indent: 2em;
            margin-bottom: 1.5rem;
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .stats {
                display: none;
            }

            .search-container {
                width: 100%;
                max-width: none;
            }

            .modal-body {
                grid-template-columns: 1fr;
            }

            .modal-cover {
                max-width: 200px;
                margin: 0 auto;
            }

            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }

        /* Side Ads */
        .side-ads {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 50;
        }

        .ad-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(99, 102, 241, 0.1) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ad-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
            pointer-events: none;  /* 修复：允许点击穿透 */
        }

        .ad-card:hover::before {
            left: 100%;
        }

        .ad-card:hover {
            transform: translateX(-5px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.4);
        }

        .ad-card.hot {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, var(--bg-card) 100%);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .ad-card.hot:hover {
            border-color: var(--secondary);
            box-shadow: 0 10px 40px -10px rgba(245, 158, 11, 0.4);
        }

        .ad-card.new {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, var(--bg-card) 100%);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .ad-card.new:hover {
            border-color: var(--success);
            box-shadow: 0 10px 40px -10px rgba(16, 185, 129, 0.4);
        }

        .ad-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        .ad-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .ad-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .ad-tag {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.2rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 600;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .ad-card.hot .ad-tag {
            background: var(--secondary);
            color: var(--bg-dark);
        }

        .ad-card.new .ad-tag {
            background: var(--success);
            color: white;
        }

        .ad-refresh-hint {
            font-size: 0.7rem;
            color: var(--primary-light);
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .ad-card:hover .ad-refresh-hint {
            opacity: 1;
        }

        /* Floating particles animation */
        .ad-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-light);
            border-radius: 50%;
            opacity: 0;
            animation: float-particle 3s infinite;
        }

        .particle:nth-child(1) { left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 50%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 80%; animation-delay: 2s; }

        @keyframes float-particle {
            0% { transform: translateY(100px); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20px); opacity: 0; }
        }

        /* Hide ads on small screens */
        @media (max-width: 900px) {
            .side-ads {
                display: none;
            }
        }

        /* Adjust main content when ads are visible */
        @media (min-width: 901px) {
            .main {
                margin-right: 200px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Footer */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 2rem;
            margin-top: 3rem;
            text-align: center;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .footer-links {
            display: flex;

            const searchSuggestions = document.getElementById('searchSuggestions');

            // Search button click
            searchBtn.addEventListener('click', () => {
                searchBooks();
                hideSuggestions();
            });

            // Search on Enter
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchBooks();
                    hideSuggestions();
                }
            });

            // Show suggestions on focus
            searchInput.addEventListener('focus', () => {
                showSuggestions();
            });

            // Update suggestions on input
            searchInput.addEventListener('input', () => {
                updateSuggestions();
                updateClearButton();
            });

            // Clear button click
            searchClear.addEventListener('click', (e) => {
                e.stopPropagation();
                searchInput.value = '';
                currentSearch = '';
                renderBooks();
                updateClearButton();
                searchInput.focus();
                showSuggestions();
            });

            // Hide suggestions when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    hideSuggestions();
                }
            });
        }

                    <span class="suggestion-icon">📖</span>
                    <span class="suggestion-text">${book.title}</span>
                    <span class="suggestion-type">${book.author}</span>
                </div>
            `).join('');
        }

        // Update suggestions based on input
        function updateSuggestions() {
            const searchInput = document.getElementById('searchInput');
            const query = searchInput.value.trim().toLowerCase();
            const suggestedBooksContainer = document.getElementById('suggestedBooks');

            if (query.length === 0) {
                renderSuggestedBooks();
                return;
            }

            // Filter books based on query
            const matchedBooks = books.filter(book =>
                book.title.toLowerCase().includes(query) ||
                book.author.toLowerCase().includes(query) ||
                book.tags.some(tag => tag.toLowerCase().includes(query))
            ).slice(0, 5);

            if (matchedBooks.length === 0) {
                suggestedBooksContainer.innerHTML = `
                    <div class="suggestion-item" style="justify-content: center; color: var(--text-muted);">
                        暂无匹配结果
                    </div>
                `;
            } else {
                suggestedBooksContainer.innerHTML = matchedBooks.map(book => `
                    <div class="suggestion-item" onclick="selectSuggestion('${book.title}')">
                        <span class="suggestion-icon">📖</span>
                        <span class="suggestion-text">${book.title}</span>
                        <span class="suggestion-type">${book.author}</span>
                    </div>
                `).join('');
            }
        }

        // Show suggestions
        function showSuggestions() {
            document.getElementById('searchSuggestions').classList.add('active');
        }

        // Hide suggestions
        function hideSuggestions() {
            document.getElementById('searchSuggestions').classList.remove('active');
        }

        // Search by tag
        function searchByTag(tag) {
            document.getElementById('searchInput').value = tag;
            searchBooks();
            hideSuggestions();
        }

        // Select suggestion
        function selectSuggestion(title) {
            document.getElementById('searchInput').value = title;
            searchBooks();
            hideSuggestions();
        }

        // Show toast notification
        function showToast(message, icon = '✓', type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMessage = document.getElementById('toastMessage');

            toastIcon.textContent = icon;
            toastMessage.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('active');

            setTimeout(() => {
                toast.classList.remove('active');
            }, 2500);
        }

        // Toggle favorite
        function toggleFavorite(bookId, event) {
            if (event) event.stopPropagation();

            const index = favorites.indexOf(bookId);
            if (index === -1) {
                favorites.push(bookId);
                showToast('已添加到收藏', '❤️', 'success');
            } else {
                favorites.splice(index, 1);
                showToast('已取消收藏', '💔', 'success');
            }
            localStorage.setItem('bookFavorites', JSON.stringify(favorites));
        }

        // Check if book is favorited
        function isFavorite(bookId) {
            return favorites.includes(bookId);
        }

        // Toggle favorite on card
        function toggleFavoriteOnCard(bookId, event) {
            event.stopPropagation();
            toggleFavorite(bookId);
            renderBooks(); // Re-render to update the heart icon
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalBooks').textContent = books.length;
            const categories = new Set(books.map(b => b.category));
            document.getElementById('totalCategories').textContent = categories.size;
        }

        // Filter books
        function getFilteredBooks() {
            return books.filter(book => {
                const matchCategory = currentCategory === 'all' || book.category === currentCategory;
                const matchSearch = !currentSearch ||
                    book.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    book.author.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    book.tags.some(tag => tag.toLowerCase().includes(currentSearch.toLowerCase()));
                return matchCategory && matchSearch;
            });
        }

        // Render books
        function renderBooks() {
            const grid = document.getElementById('bookGrid');
            const filteredBooks = getFilteredBooks();

            if (filteredBooks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">📖</div>
                        <h3>没有找到相关书籍</h3>
                        <p>试试其他关键词或分类</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredBooks.map(book => `
                <div class="book-card" onclick="openBookDetail(${book.id})">
                    <div class="book-cover">
                        <img src="${book.cover}" alt="${book.title}" loading="lazy">
                        ${book.badge ? `<span class="book-badge">${book.badge}</span>` : ''}
                        <button class="book-favorite ${isFavorite(book.id) ? 'active' : ''}" onclick="toggleFavoriteOnCard(${book.id}, event)">
                            ${isFavorite(book.id) ? '❤️' : '🤍'}
                        </button>
                        <div class="book-rating">
                            <span class="star">★</span>
                            <span>${book.rating}</span>
                        </div>
                    </div>
                    <div class="book-info">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">${book.author}</p>
                        <div class="book-meta">
                            <span class="book-category">${book.category}</span>
                            <span class="book-pages">${book.pages}页</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Search
        function searchBooks() {
            currentSearch = document.getElementById('searchInput').value.trim();
            renderBooks();
        }

        // Filter by category
        function filterByCategory(category) {
            currentCategory = category;

            // Update active button
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === category || (category === 'all' && btn.textContent === '全部')) {
                    btn.classList.add('active');
                }
            });

            renderBooks();
        }

        // Open book detail
        function openBookDetail(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="modal-cover">
                    <img src="${book.cover}" alt="${book.title}">
                </div>
                <div class="modal-details">
                    <h2>${book.title}</h2>
                    <p class="modal-author">作者：${book.author}</p>

                    <div class="modal-stats">
                        <div class="modal-stat">
                            <div class="modal-stat-value">${book.rating}</div>
                            <div class="modal-stat-label">评分</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-value">${book.pages}</div>
                            <div class="modal-stat-label">页数</div>
                        </div>
                        <div class="modal-stat">
                            <div class="modal-stat-value">${book.year}</div>
                            <div class="modal-stat-label">出版年份</div>
                        </div>
                    </div>

                    <div class="modal-section">
                        <h3>简介</h3>
                        <p>${book.description}</p>
                    </div>

                    <div class="modal-section">
                        <h3>标签</h3>
                        <div class="modal-tags">
                            ${book.tags.map(tag => `<span class="modal-tag">${tag}</span>`).join('')}
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button class="btn btn-primary" onclick="showPreview(${book.id})">
                            📖 开始阅读
                        </button>
                        <button class="btn btn-secondary" id="favoriteBtn" onclick="toggleFavoriteInModal(${book.id})">
                            ${isFavorite(book.id) ? '💔 取消收藏' : '❤️ 收藏'}
                        </button>
                    </div>

                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <div class="preview-content" id="previewContent"></div>
                    </div>
                </div>
            `;

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Show preview
        function showPreview(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            const container = document.getElementById('previewContainer');
            const content = document.getElementById('previewContent');

            content.innerHTML = book.preview.split('\n\n').map(p => `<p>${p}</p>`).join('');
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth' });
        }

        // Toggle favorite in modal
        function toggleFavoriteInModal(bookId) {
            toggleFavorite(bookId);
            const favoriteBtn = document.getElementById('favoriteBtn');
            if (isFavorite(bookId)) {
                favoriteBtn.innerHTML = '💔 取消收藏';
            } else {
                favoriteBtn.innerHTML = '❤️ 收藏';
            }
        }

        // Close modal
        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Refresh page when clicking ads
        function refreshPage(adName) {
            // Show a brief loading effect
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(15, 23, 42, 0.9);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                animation: fadeIn 0.3s ease;
            `;
            overlay.innerHTML = `
                <div style="
                    width: 50px;
                    height: 50px;
                    border: 3px solid #334155;
                    border-top-color: #6366f1;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 1rem;
                "></div>
                <div style="color: #f1f5f9; font-size: 1.1rem; margin-bottom: 0.5rem;">
                    正在加载 "${adName}"
                </div>
                <div style="color: #64748b; font-size: 0.85rem;">
                    页面即将刷新...
                </div>
            `;
            document.body.appendChild(overlay);

            // Refresh after a short delay
            setTimeout(() => {
                location.reload();
            }, 800);
        }
    </script>
</body>
</html>
